name: Release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: '20'

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build Rust
        working-directory: rust-core
        run: cargo build --release

      - name: Install & Build TypeScript
        working-directory: typescript-mcp
        run: |
          npm ci
          npm run build

      - name: Package
        run: |
          mkdir -p dist
          tar -czf dist/codesight-linux-x64.tar.gz -C rust-core/target/release .

      - name: Changelog
        run: git log --pretty=format:"- %s" $(git describe --tags --abbrev=0 HEAD^)..HEAD > CHANGELOG.md

      - name: GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          body_path: CHANGELOG.md
